[project]
name = "realestate-sales-agent"
version = "0.1.0"
description = "Multi-tenant RAG assistant for real-estate WhatsApp sales"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13,<2.0",
    "apscheduler>=3.10,<4.0",
    "asyncpg>=0.29,<1.0",
    "fastapi>=0.115,<1.0",
    "httpx>=0.27,<1.0",
    "openai>=1.50,<2.0",
    "ollama>=0.4,<1.0",
    "pgvector>=0.5,<1.0",
    "pydantic-settings>=2.6,<3.0",
    "python-multipart>=0.0.9,<1.0",
    "redis[hiredis]>=5.0,<6.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "ruff>=0.8,<1.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
